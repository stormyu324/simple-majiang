<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>简单麻将</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 40'><rect x='1' y='1' width='28' height='38' rx='4' fill='%23fbf7ea' stroke='%233f8f6a' stroke-width='2'/><text x='15' y='27' font-size='20' font-weight='bold' text-anchor='middle' fill='%23c62828'>中</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>简单麻将 <span id="variant-name" class="variant-name"></span></h1>
    <div class="bar-buttons">
      <button id="tutorial-btn" class="btn">📖 新手教学</button>
      <button id="rules-btn" class="btn">📜 玩法规则</button>
      <button id="hints" class="btn" aria-pressed="false">提示：关</button>
      <button id="big-tiles" class="btn" aria-pressed="false">🔍 大牌</button>
      <button id="restart" class="btn solo-only">重新开始</button>
      <button id="menu" class="btn game-only">返回菜单</button>
    </div>
  </header>

  <!-- 菜单和等候室：开局前显示，开局后隐藏 -->
  <section id="lobby" class="lobby">
    <div class="panel" data-screen="home">
      <p class="invite-note" hidden></p>
      <label class="field">玩法
        <select id="variant" class="variant-select"></select>
      </label>
      <p class="variant-desc muted small"></p>
      <button class="btn primary big" data-act="solo">🀄 单人练习 <small>和电脑打</small></button>

      <h2>好友对战</h2>
      <label class="field">你的名字
        <input id="name" maxlength="12" placeholder="玩家" autocomplete="nickname">
      </label>
      <button class="btn primary" data-act="create">创建房间</button>
      <div class="join-row">
        <input id="code" inputmode="numeric" maxlength="4" placeholder="4 位房间号" aria-label="房间号">
        <button class="btn" data-act="join">加入</button>
        <button class="btn" data-act="watch">👀 观战</button>
      </div>
      <p class="muted small">用上面选的玩法开房间，进房间后房主还可以换。空座位由电脑补上。观战的人只能看到打出和碰出的牌。</p>
      <p class="lobby-error" role="alert"></p>
    </div>

    <div class="panel" data-screen="room" hidden>
      <p class="muted">房间号</p>
      <div class="room-code">----</div>
      <div class="room-variant"></div>
      <button class="btn" data-room="invite">📋 复制邀请链接</button>
      <ol class="seat-list"></ol>
      <p class="room-spectators muted small"></p>
      <div class="room-start"></div>
      <button class="btn light-text" data-room="leave">离开房间</button>
    </div>
  </section>

  <div id="room-bar" class="room-bar" hidden></div>

  <main class="table" hidden>
    <section id="seat-2" class="seat top"></section>
    <section id="seat-3" class="seat left"></section>
    <section id="center" class="center"></section>
    <section id="seat-1" class="seat right"></section>
    <section id="seat-0" class="seat bottom"></section>
  </main>

  <details class="log-box game-only">
    <summary>对局记录</summary>
    <ol id="log"></ol>
  </details>

  <div id="result" class="overlay" hidden>
    <div class="dialog result">
      <h2></h2>
      <div class="result-wins"></div>
      <table class="score-table"></table>
      <ul class="result-lines"></ul>
      <div class="dialog-buttons">
        <button id="result-close" class="btn light">看看牌桌</button>
        <button id="again" class="btn primary">再来一局</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <div id="rules" class="overlay" hidden>
    <div class="dialog rules" role="dialog" aria-modal="true" aria-labelledby="rules-title">
      <h2 id="rules-title"></h2>
      <ol class="rules-list"></ol>
      <p class="muted small">各地规则差别很大，这里按最常见的打法来做。</p>
      <div class="dialog-buttons"><button class="btn primary" data-close="rules">知道了</button></div>
    </div>
  </div>

  <div id="tutorial" class="overlay" hidden>
    <div class="dialog tutorial" role="dialog" aria-modal="true" aria-labelledby="tut-title">
      <div class="tut-top">
        <span class="tut-progress"></span>
        <button class="tut-close" data-tut="close" aria-label="关闭教学">✕</button>
      </div>
      <div class="tut-track"><div class="tut-bar"></div></div>
      <h2 id="tut-title"></h2>
      <div class="tut-body"></div>
      <div class="tut-nav">
        <button class="btn light" data-tut="prev">上一步</button>
        <button class="btn primary" data-tut="next">下一步</button>
      </div>
    </div>
  </div>

  <div id="file-warning" class="overlay" hidden>
    <div class="dialog">
      <h2>需要用本地服务器打开</h2>
      <p>浏览器不允许直接双击打开这个页面里的模块代码。<br>
        请在项目文件夹的终端里运行 <code>npm run web</code>，它会自动在浏览器里打开游戏。</p>
    </div>
  </div>

  <script>
    if (location.protocol === 'file:') document.getElementById('file-warning').hidden = false;
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
