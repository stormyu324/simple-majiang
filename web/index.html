<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>简单麻将</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>简单麻将</h1>
    <button id="restart" class="btn">重新开始</button>
  </header>

  <main class="table">
    <section id="seat-2" class="seat top"></section>
    <section id="seat-3" class="seat left"></section>
    <section id="center" class="center"></section>
    <section id="seat-1" class="seat right"></section>
    <section id="seat-0" class="seat bottom"></section>
  </main>

  <details class="log-box">
    <summary>对局记录</summary>
    <ol id="log"></ol>
  </details>

  <div id="result" class="overlay" hidden>
    <div class="dialog">
      <h2></h2>
      <p class="detail"></p>
      <div class="hand-row"></div>
      <button id="again" class="btn primary">再来一局</button>
    </div>
  </div>

  <div id="file-warning" class="overlay" hidden>
    <div class="dialog">
      <h2>需要用本地服务器打开</h2>
      <p>浏览器不允许直接双击打开这个页面里的模块代码。<br>
        请在项目文件夹的终端里运行 <code>npm run web</code>，它会自动在浏览器里打开游戏。</p>
    </div>
  </div>

  <script>
    if (location.protocol === 'file:') document.getElementById('file-warning').hidden = false;
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
